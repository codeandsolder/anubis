name: Smoke tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Discard superseded PR revisions; keep independent events and PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.batch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: service
            cases: |
              default-config-macro
              docker-registry
              healthcheck
              log-file
          - batch: proxy
            cases: |
              double_slash
              gitweb
              nginx
              traefik
          - batch: browser
            cases: |
              forced-language
              i18n
              lightpanda
              palemoon/amd64
          - batch: routing
            cases: |
              git-clone
              git-push
              robots_txt
              wildcard-match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: wasm32-unknown-unknown
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@6c75050a784dea5e37d28b094ce9ef3ef6c40829 # main

      - name: Setup `wasmtime`
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Install utils
        run: |
          go install ./utils/cmd/...

      - name: Run each smoke case in the batch
        shell: bash
        env:
          SMOKE_CASES: ${{ matrix.cases }}
        run: |
          failed=0
          while IFS= read -r test_case; do
            [[ -z "$test_case" ]] && continue
            echo "::group::Smoke test $test_case"
            if ! (
              cd "test/$test_case"
              # Some upstream tests leave Docker Compose services running.
              # Stop them before the next case in this shared runner slot.
              trap 'if [[ -f compose.yml || -f compose.yaml || -f docker-compose.yml || -f docker-compose.yaml ]]; then docker compose down --remove-orphans; fi' EXIT
              backoff-retry --try-count 10 ./test.sh
            ); then
              echo "::error::Smoke test failed: $test_case"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$SMOKE_CASES"
          exit "$failed"

      - name: Upload batch artifacts (retains per-case directories)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-${{ matrix.batch }}
          path: test/**/var

      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@6c75050a784dea5e37d28b094ce9ef3ef6c40829 # main
